
name: Basic GitHub Action

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print a message
        run: echo "Hello! GitHub Actions is working."

      - name: Show current directory
        run: pwd

      - name: List files
        run: ls -la

